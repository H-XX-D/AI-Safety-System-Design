# ORKASTRATOR Secure Cluster Configuration
# ==========================================
#
# This is the hardened configuration for the AI self-improvement cluster.
# 
# SECURITY FEATURES:
# - SSH key-based authentication (no passwords in config)
# - Node identity verification via fingerprints
# - Docker sandbox required (no fallback)
# - Human approval required before deployment
# - WORM manifest verification
#
# SETUP:
# 1. Generate SSH keys: python scripts/secure_config.py setup-keys
# 2. Deploy keys to nodes: ssh-copy-id -i ~/.ssh/id_orkastrator user@node
# 3. Generate fingerprints: python scripts/secure_config.py fingerprints
# 4. Update fingerprints in this file
# 5. Validate: python scripts/secure_config.py validate

