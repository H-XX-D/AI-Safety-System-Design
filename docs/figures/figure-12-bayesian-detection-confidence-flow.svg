<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">Figure 12: Bayesian Detection Confidence Flow</title>
  <desc id="desc">Prior to posterior update via evidence streams gating negligence penalty and early detection bonus thresholds.</desc>
  <style><![CDATA[
    .box { fill:#fff; stroke:#222; stroke-width:2; rx:10; ry:10; }
    .label { font:600 16px sans-serif; }
    .note { font:14px sans-serif; }
    .wire { stroke:#222; stroke-width:2; marker-end:url(#arrow); fill:none; }
  ]]></style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker>
  </defs>

  <rect class="box" x="460" y="60" width="180" height="70"/>
  <text class="label" x="550" y="105" text-anchor="middle">Prior p(d)=p0</text>

  <rect class="box" x="340" y="180" width="420" height="160"/>
  <text class="label" x="550" y="215" text-anchor="middle">Evidence Streams</text>
  <text class="note" x="550" y="240" text-anchor="middle">Detector Signal (s)</text>
  <text class="note" x="550" y="260" text-anchor="middle">Sandbox Anomalies (a)</text>
  <text class="note" x="550" y="280" text-anchor="middle">Pattern Drift (Δ)</text>

  <rect class="box" x="460" y="370" width="180" height="90"/>
  <text class="label" x="550" y="405" text-anchor="middle">Posterior p(d|E)</text>
  <text class="note" x="550" y="425" text-anchor="middle">Bayes Update</text>

  <rect class="box" x="260" y="500" width="220" height="90"/>
  <text class="label" x="370" y="535" text-anchor="middle">Negligence Penalty Gate τ</text>

  <rect class="box" x="620" y="500" width="220" height="90"/>
  <text class="label" x="730" y="535" text-anchor="middle">Early Detection Bonus τ_early</text>

  <rect class="box" x="460" y="620" width="180" height="70"/>
  <text class="label" x="550" y="660" text-anchor="middle">Posterior Broadcast</text>

  <line class="wire" x1="550" y1="130" x2="550" y2="180"/>
  <line class="wire" x1="550" y1="340" x2="550" y2="370"/>
  <line class="wire" x1="550" y1="460" x2="370" y2="500"/>
  <line class="wire" x1="550" y1="460" x2="730" y2="500"/>
  <line class="wire" x1="370" y1="590" x2="550" y2="620"/>
  <line class="wire" x1="730" y1="590" x2="550" y2="620"/>
</svg>
