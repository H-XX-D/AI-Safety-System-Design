<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Figure 5: Hardware Translator Device</title>
  <desc id="desc">Air-gapped translator connected via removable media performing semantic analysis, seed-chain audits, and proof generation.</desc>
  <style><![CDATA[
    .box { fill:#fff; stroke:#222; stroke-width:2; rx:10; ry:10; }
    .label { font:600 16px sans-serif; }
    .note { font:14px sans-serif; }
    .wire { stroke:#222; stroke-width:2; marker-end:url(#arrow); fill:none; }
  ]]></style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker>
  </defs>

  <rect class="box" x="60" y="80" width="280" height="120"/>
  <text class="label" x="200" y="125" text-anchor="middle">Removable Media</text>
  <text class="note" x="200" y="150" text-anchor="middle">USB / SD (ingest only)</text>

  <rect class="box" x="380" y="40" width="260" height="180"/>
  <text class="label" x="510" y="90" text-anchor="middle">Translator (Air-Gapped)</text>
  <text class="note" x="510" y="115" text-anchor="middle">Semantic Analysis</text>
  <text class="note" x="510" y="135" text-anchor="middle">Seed-Chain Audit Selector</text>
  <text class="note" x="510" y="155" text-anchor="middle">Proof Generation</text>

  <rect class="box" x="700" y="80" width="240" height="120"/>
  <text class="label" x="820" y="120" text-anchor="middle">Reports / Flags</text>
  <text class="note" x="820" y="145" text-anchor="middle">Signatures, Hashes</text>

  <line class="wire" x1="340" y1="140" x2="380" y2="140"/>
  <line class="wire" x1="640" y1="140" x2="700" y2="140"/>
</svg>
