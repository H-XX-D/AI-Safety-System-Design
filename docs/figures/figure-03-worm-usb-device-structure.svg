<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Figure 3: WORM USB Device Structure</title>
  <desc id="desc">Shows tamper-evident case, write-protect firmware, data region with core values, hashes, multi-sig keys, penalty multipliers, and read-only interface.</desc>
  <style><![CDATA[
    .box { fill:#fff; stroke:#222; stroke-width:2; rx:10; ry:10; }
    .title { font:700 18px sans-serif; }
    .label { font:600 15px sans-serif; }
    .note { font:14px sans-serif; }
    .section { fill:#f7f9fc; stroke:#335; stroke-width:1.5; rx:8; ry:8; }
  ]]></style>

  <!-- Outer case -->
  <rect class="box" x="60" y="40" width="780" height="520"/>
  <text class="title" x="450" y="70" text-anchor="middle">Tamper-Evident Case</text>

  <!-- Write protect FW -->
  <rect class="section" x="100" y="100" width="700" height="80"/>
  <text class="label" x="450" y="145" text-anchor="middle">Write-Protect Firmware (immutable after burn)</text>

  <!-- Data Region -->
  <rect class="section" x="100" y="210" width="700" height="200"/>
  <text class="label" x="450" y="240" text-anchor="middle">Data Region</text>

  <text class="note" x="140" y="270">• Core Values (JSON)</text>
  <text class="note" x="140" y="295">• Hashes (SHA-256)</text>
  <text class="note" x="140" y="320">• Multi-Signature Public Keys</text>
  <text class="note" x="140" y="345">• Permanent Penalty Multipliers</text>

  <!-- Read-only Interface -->
  <rect class="section" x="100" y="440" width="700" height="80"/>
  <text class="label" x="450" y="485" text-anchor="middle">Read-Only Interface</text>
</svg>
