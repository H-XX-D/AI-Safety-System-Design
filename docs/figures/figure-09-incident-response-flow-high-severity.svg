<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Figure 9: Incident Response Flow (High Severity)</title>
  <desc id="desc">Steps from detection to human review, including halt, power cut, isolate media, forensics.</desc>
  <style><![CDATA[
    .box { fill:#fff; stroke:#222; stroke-width:2; rx:8; ry:8; }
    .label { font:600 16px sans-serif; }
    .wire { stroke:#222; stroke-width:2; marker-end:url(#arrow); fill:none; }
  ]]></style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker>
  </defs>

  <rect class="box" x="40" y="60" width="160" height="60"/>
  <text class="label" x="120" y="95" text-anchor="middle">Detect</text>
  <rect class="box" x="240" y="60" width="160" height="60"/>
  <text class="label" x="320" y="95" text-anchor="middle">Halt Outputs</text>
  <rect class="box" x="440" y="60" width="160" height="60"/>
  <text class="label" x="520" y="95" text-anchor="middle">Power Cut</text>
  <rect class="box" x="640" y="60" width="160" height="60"/>
  <text class="label" x="720" y="95" text-anchor="middle">Isolate Media</text>
  <rect class="box" x="840" y="60" width="220" height="60"/>
  <text class="label" x="950" y="95" text-anchor="middle">Forensics @ DGX7</text>

  <line class="wire" x1="200" y1="90" x2="240" y2="90"/>
  <line class="wire" x1="400" y1="90" x2="440" y2="90"/>
  <line class="wire" x1="600" y1="90" x2="640" y2="90"/>
  <line class="wire" x1="800" y1="90" x2="840" y2="90"/>

  <!-- Human Review branch -->
  <rect class="box" x="640" y="170" width="220" height="60"/>
  <text class="label" x="750" y="205" text-anchor="middle">Human Review</text>
  <line class="wire" x1="950" y1="120" x2="750" y2="170"/>
</svg>
