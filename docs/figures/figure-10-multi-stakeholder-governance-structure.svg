<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Figure 10: Multi-Stakeholder Governance Structure</title>
  <desc id="desc">Council with 15 seats across stakeholder groups and voting thresholds.</desc>
  <style><![CDATA[
    .box { fill:#fff; stroke:#222; stroke-width:2; rx:10; ry:10; }
    .label { font:600 16px sans-serif; }
    .note { font:14px sans-serif; }
  ]]></style>

  <rect class="box" x="200" y="60" width="500" height="80"/>
  <text class="label" x="450" y="110" text-anchor="middle">Certification Council (15)</text>

  <rect class="box" x="80" y="180" width="160" height="60"/>
  <text class="label" x="160" y="215" text-anchor="middle">4 Academia</text>

  <rect class="box" x="260" y="180" width="160" height="60"/>
  <text class="label" x="340" y="215" text-anchor="middle">3 Gov</text>

  <rect class="box" x="440" y="180" width="160" height="60"/>
  <text class="label" x="520" y="215" text-anchor="middle">3 Industry</text>

  <rect class="box" x="620" y="180" width="160" height="60"/>
  <text class="label" x="700" y="215" text-anchor="middle">3 Indep. Experts</text>

  <rect class="box" x="360" y="260" width="180" height="60"/>
  <text class="label" x="450" y="295" text-anchor="middle">2 Civil Society</text>

  <text class="note" x="450" y="360" text-anchor="middle">Thresholds: Simple 8/15 • Super 10/15 • Near-unanimous 13/15</text>
</svg>
