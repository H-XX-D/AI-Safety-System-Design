<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Figure 1: System Architecture Overview</title>
  <desc id="desc">High-level diagram showing Human Oversight, six Research DGX nodes feeding into ORCA Orchestrator with WORM/Manifest, and an air-gapped DGX7 validator.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <style><![CDATA[
      .box { fill:#f8f9fa; stroke:#333; stroke-width:2; rx:8; ry:8; }
      .title { font: 700 20px sans-serif; fill:#111; }
      .label { font: 600 16px sans-serif; fill:#222; }
      .note { font: 14px sans-serif; fill:#444; }
      .wire { stroke:#333; stroke-width:2; fill:none; marker-end:url(#arrow); }
    ]]></style>
  </defs>

  <!-- Human Oversight -->
  <rect class="box" x="450" y="20" width="300" height="60"/>
  <text class="title" x="600" y="58" text-anchor="middle">Human Oversight (Council/UI)</text>

  <!-- Research DGX Nodes -->
  <g id="research-row">
    <rect class="box" x="40" y="140" width="160" height="80"/>
    <text class="label" x="120" y="175" text-anchor="middle">DGX #1</text>
    <text class="note" x="120" y="195" text-anchor="middle">Research</text>

    <rect class="box" x="220" y="140" width="160" height="80"/>
    <text class="label" x="300" y="175" text-anchor="middle">DGX #2</text>
    <text class="note" x="300" y="195" text-anchor="middle">Research</text>

    <rect class="box" x="400" y="140" width="160" height="80"/>
    <text class="label" x="480" y="175" text-anchor="middle">DGX #3</text>
    <text class="note" x="480" y="195" text-anchor="middle">Research</text>

    <rect class="box" x="580" y="140" width="160" height="80"/>
    <text class="label" x="660" y="175" text-anchor="middle">DGX #4</text>
    <text class="note" x="660" y="195" text-anchor="middle">Research</text>

    <rect class="box" x="760" y="140" width="160" height="80"/>
    <text class="label" x="840" y="175" text-anchor="middle">DGX #5</text>
    <text class="note" x="840" y="195" text-anchor="middle">Research</text>

    <rect class="box" x="940" y="140" width="160" height="80"/>
    <text class="label" x="1020" y="175" text-anchor="middle">DGX #6</text>
    <text class="note" x="1020" y="195" text-anchor="middle">Research</text>
  </g>

  <!-- ORCA Orchestrator -->
  <rect class="box" x="200" y="300" width="800" height="90"/>
  <text class="title" x="600" y="335" text-anchor="middle">ORCA Orchestrator (Tier 2)</text>
  <text class="note" x="600" y="355" text-anchor="middle">Debate, Sandbox, Structural Checks</text>

  <!-- WORM / Manifest boxes -->
  <rect class="box" x="320" y="410" width="220" height="80"/>
  <text class="label" x="430" y="445" text-anchor="middle">WORM USB</text>
  <text class="note" x="430" y="465" text-anchor="middle">Core Values, Keys</text>

  <rect class="box" x="660" y="410" width="220" height="80"/>
  <text class="label" x="770" y="445" text-anchor="middle">Manifest</text>
  <text class="note" x="770" y="465" text-anchor="middle">Merkle Root + Signatures</text>

  <!-- DGX7 -->
  <rect class="box" x="250" y="540" width="700" height="110"/>
  <text class="title" x="600" y="585" text-anchor="middle">DGX #7 (Air-Gapped Validator)</text>
  <text class="note" x="600" y="605" text-anchor="middle">Stateless Validation, Independent Rebuilds</text>

  <!-- Wires -->
  <line class="wire" x1="600" y1="80" x2="600" y2="140"/>
  <line class="wire" x1="120" y1="220" x2="600" y2="300"/>
  <line class="wire" x1="300" y1="220" x2="600" y2="300"/>
  <line class="wire" x1="480" y1="220" x2="600" y2="300"/>
  <line class="wire" x1="660" y1="220" x2="600" y2="300"/>
  <line class="wire" x1="840" y1="220" x2="600" y2="300"/>
  <line class="wire" x1="1020" y1="220" x2="600" y2="300"/>

  <line class="wire" x1="430" y1="490" x2="600" y2="540"/>
  <line class="wire" x1="770" y1="490" x2="600" y2="540"/>
</svg>
